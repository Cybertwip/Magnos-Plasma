<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar Slingshot</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell stage-shell">
    <header class="topbar stage-topbar">
      <h1>Solar Slingshot</h1>
      <div class="top-actions">
        <button id="playButton" type="button">Pause</button>
        <button id="resetButton" type="button" class="secondary">Reset</button>
        <button id="launchButton" type="button" class="accent">Launch</button>
      </div>
    </header>

    <section class="viewport-card stage-viewport">
      <div id="viewport" class="viewport" aria-label="Interactive 3D solar system simulation">
        <canvas id="sceneCanvas"></canvas>
        <div id="labels" class="labels-layer" aria-hidden="true"></div>

        <div class="mission-clocks" aria-live="polite">
          <article class="mission-clock earth-clock">
            <span class="clock-kicker">EARTH</span>
            <strong id="earthClockValue">0.000 Earth yr</strong>
            <small id="earthClockProjection">Waiting for launch</small>
          </article>
          <article class="mission-clock traveler-clock">
            <span class="clock-kicker">TRAVELER</span>
            <strong id="travelerClockValue">0.000 Earth yr</strong>
            <small id="travelerClockProjection">Waiting for launch</small>
          </article>
        </div>

        <aside class="flight-card">
          <span id="statusBadge" class="badge">RUNNING</span>
          <p id="rocketStateStat">Not launched</p>
          <dl>
            <div><dt>Speed</dt><dd id="rocketSpeedStat">—</dd></div>
            <div><dt>Distance</dt><dd id="solarDistanceStat">—</dd></div>
            <div><dt>Route</dt><dd id="routeStat">Launch to fly</dd></div>
          </dl>
        </aside>

        <div class="stage-controls">
          <label class="stage-control" for="speedSlider">
            <span>Speed <strong id="speedValue">10 d/s</strong></span>
            <input id="speedSlider" type="range" min="-2" max="2.5623" step="0.01" value="1">
          </label>
          <label class="stage-control" for="focusSelect">
            <span>Camera</span>
            <select id="focusSelect">
              <option value="Sol">Sun</option>
              <option value="Earth" selected>Earth</option>
              <option value="Jupiter">Jupiter</option>
              <option value="Rocket">Rocket</option>
            </select>
          </label>
        </div>
      </div>
    </section>
  </main>

  <div class="internal-controls" hidden aria-hidden="true">
    <input id="injectionSlider" type="range" min="0" max="20" step="0.1" value="3.2"><span id="injectionValue"></span>
    <input id="flybySlider" type="range" min="100" max="50000" step="100" value="500"><span id="flybyValue"></span>
    <input id="cruiseThrustSlider" type="range" min="0" max="100" step="1" value="100"><span id="cruiseThrustValue"></span>
    <input id="casimirGapSlider" type="range" min="10" max="500" step="5" value="100"><span id="casimirGapValue"></span>
    <input id="brakeToggle" type="checkbox" checked>
    <input id="oberthSlider" type="range" min="0" max="20" step="0.1" value="8"><span id="oberthValue"></span>
    <input id="periSlider" type="range" min="3" max="20" step="0.5" value="8"><span id="periValue"></span>
    <input id="trailToggle" type="checkbox" checked>
    <input id="labelToggle" type="checkbox" checked>
    <input id="rocketTrailToggle" type="checkbox" checked>
    <input id="magnosGain" type="number" min="1" max="6000" step="1" value="1">
    <select id="magnosLoad"><option value="plasma" selected>plasma</option></select>
    <span id="dateStat"></span><span id="elapsedStat"></span><span id="sunBaryStat"></span><span id="energyDriftStat"></span>
    <span id="assistGainStat"></span><span id="propulsorStat"></span><span id="casimirStat"></span><span id="spaceTempStat"></span>
    <span id="closestStat"></span><span id="vinfStat"></span><span id="oberthStat"></span>
    <span id="peakSpeedStat"></span><span id="helioSpeedStat"></span><span id="alphaStat"></span><span id="solarExitStat"></span>
    <span id="magnosInput"></span><span id="magnosOutput"></span><span id="magnosStatus"></span>
    <span id="plasmaElectricalStat"></span><span id="plasmaMagneticStat"></span>
    <span id="plasmaThrustStat"></span><span id="plasmaAccelerationStat"></span>
    <span id="shieldEmfStat"></span><span id="shieldAttenuationStat"></span>
    <span id="coilTempFill"></span><span id="coilTempValue"></span>
    <span id="reactorTempFill"></span><span id="reactorTempValue"></span>
    <span id="radiatorTempFill"></span><span id="radiatorTempValue"></span>
    <span id="hullTempFill"></span><span id="hullTempValue"></span>
    <span id="shieldTempFill"></span><span id="shieldTempValue"></span>
    <span id="radiatorDeployStat"></span><span id="thermalGovernorStat"></span>
    <span id="relativityDelta"></span>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
